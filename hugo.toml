baseURL = 'https://maevik.dev/'
locale = 'en-us'
title = 'maevik.dev'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[params]
  description = "my personal website"
  author = 'maevik'

[markup.goldmark.renderer]
  unsafe = true

[[module.mounts]]
  source = 'static'
  target = 'assets/images'

[[module.mounts]]
  source = 'static'
  target = 'static'
  files = ['! bg.png', '! bg-line-art.png', '! banners/**', '! png/**']

[[module.mounts]]
  source = 'assets'
  target = 'assets'
